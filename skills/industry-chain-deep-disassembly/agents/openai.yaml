interface:
  display_name: "Industry Chain Deep Disassembly"
  short_description: "Disassemble industry chains and forecast current and future supply gaps."
  default_prompt: "Use $industry-chain-deep-disassembly to decompose a growth industry into demand signals, supply-chain topology, BOM/value nodes, current supply-gap choke points, constraint mechanisms, and future supply-gap migration. Treat 堵点/卡点 as nodes where demand exceeds qualified supply in the stated window. Only map stocks if the user explicitly asks for listed exposure after node diagnosis."
