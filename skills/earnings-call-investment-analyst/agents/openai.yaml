interface:
  display_name: "Earnings Call Investment Analyst"
  short_description: "Analyze earnings releases, guidance, original company materials, replay assets, expectation gaps, and post-earnings stock reactions."
  default_prompt: "Use $earnings-call-investment-analyst to analyze a company's earnings release and conference call. Build an evidence pack first: source inventory, official filings/release, webcast assets, transcript or replay audio status, and explicit source gaps. Start from company-hosted original materials and SEC/exchange filings. If official IR, the company-hosted event page, or the official event platform does not expose a complete transcript/audio/video replay, continue searching fallback paths before giving up: StockAnalysis, Quartr, Motley Fool, Seeking Alpha, Benzinga, Alpha Spread, and EarningsCall.biz. If a reputable third-party full transcript and original call audio are both available, use the full transcript as the primary working source and use the audio only for targeted verification of decision-useful wording, disputed passages, and transcript quality issues; do not run full-audio ASR by default. If a complete recording is found on StockAnalysis, Quartr, or another transcript/audio aggregator, label it as original call audio with third-party hosting, not as company-hosted or official-event-hosted. Compare actuals against guidance and consensus, extract decision-useful management commentary with fact/claim/inference labels, judge guidance quality, assess fundamental and trading implications, and produce a concise follow-up checklist."
