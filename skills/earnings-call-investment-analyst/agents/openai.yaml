interface:
  display_name: "Earnings Call Investment Analyst"
  short_description: "Analyze earnings releases, guidance, original company materials, replay assets, expectation gaps, and post-earnings stock reactions."
  default_prompt: "Use $earnings-call-investment-analyst to analyze a company's earnings release and conference call. Build an evidence pack with source inventory, official filings/release status, call transcript or replay audio status, source quality labels, and explicit source gaps. Prefer company-hosted original materials and SEC/exchange filings for reported financials, but use the fastest reliable route to obtain complete call content: official pages, search, reputable transcript or audio providers, browser inspection, HTTP, page source, network requests, direct downloads, event-platform payloads, or bundled scripts when helpful. Treat provider names and scripts as examples and tools, not mandatory steps. If a script cannot fetch, parse, or download the relevant transcript, audio, or video, continue through another defensible route and record the limitation only if the script was used. If a reputable third-party full transcript and original call audio are both available, use the full transcript as the primary working source and use the audio only for targeted verification of decision-useful wording, disputed passages, and transcript quality issues; do not run full-audio ASR by default. Label third-party-hosted original audio accurately. Compare actuals against guidance and consensus, extract decision-useful management commentary with fact/claim/inference labels, judge guidance quality, assess fundamental and trading implications, and produce a concise follow-up checklist."
